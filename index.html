<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orçamento PURISOL</title>
  <script>
    function calcularOrcamento() {
      const nome = document.getElementById('nome').value;
      const contato = document.getElementById('contato').value;
      const placas = parseInt(document.getElementById('placas').value);

      if (!nome || !contato || !placas || placas <= 0) {
        alert('Por favor, preencha todos os campos corretamente.');
        return;
      }

      const kitPurisol = placas;
      const precoKitUnit = 17;
      const valorKit = kitPurisol * precoKitUnit;
      const cano20mm = placas * 1.25;
      const precoCano20mm = 3.15 * cano20mm;
      const precoCano32mm = 4.98 * 10;
      const precoCano50mm = 12 * 20;
      const caixa = 389.90;
      const automacao = 1878;
      const acessorios = 1000;
      const miscelaneas = 0;
      const maoObra = Math.ceil(placas / 20) * 200;

      const litrosHora = placas * 100;
      let bombaNome = '';
      let bombaPreco = 0;
      if (litrosHora <= 7500) {
        bombaNome = 'Bomba 1CV'; bombaPreco = 1429.94;
      } else if (litrosHora <= 15000) {
        bombaNome = 'Bomba 2CV'; bombaPreco = 1716.22;
      } else if (litrosHora <= 24000) {
        bombaNome = 'Bomba 3CV'; bombaPreco = 2051.58;
      } else if (litrosHora <= 35000) {
        bombaNome = 'Bomba 4CV'; bombaPreco = 5330.31;
      } else {
        bombaNome = 'Bomba 5CV'; bombaPreco = 5983.57;
      }

      const custoTotal = (
        valorKit +
        precoCano20mm +
        precoCano32mm +
        precoCano50mm +
        caixa +
        bombaPreco +
        automacao +
        acessorios +
        miscelaneas +
        maoObra
      ).toFixed(2);

      const custoPorPlaca = (custoTotal / placas).toFixed(2);

      document.getElementById('resultado').innerHTML = `
        <div id="proposta">
          <h3 class="text-lg font-bold mb-2">Resultado do Orçamento:</h3>
          <p><strong>Cliente:</strong> ${nome}</p>
          <p><strong>Contato:</strong> ${contato}</p>
          <p><strong>Total de Placas:</strong> ${placas}</p>
          <p><strong>Kit Purisol:</strong> ${kitPurisol} unidades (R$ ${valorKit.toFixed(2)})</p>
          <p><strong>Canos 20mm:</strong> ${cano20mm.toFixed(2)} m (R$ ${precoCano20mm.toFixed(2)})</p>
          <p><strong>Canos 32mm:</strong> 10 m (R$ ${precoCano32mm.toFixed(2)})</p>
          <p><strong>Canos 50mm:</strong> 20 m (R$ ${precoCano50mm.toFixed(2)})</p>
          <p><strong>Caixa d'água:</strong> R$ ${caixa}</p>
          <p><strong>Automação:</strong> R$ ${automacao}</p>
          <p><strong>Conexões e acessórios:</strong> R$ ${acessorios}</p>
          <p><strong>Miscelâneas:</strong> R$ ${miscelaneas}</p>
          <p><strong>Bomba:</strong> ${bombaNome} (R$ ${bombaPreco.toFixed(2)})</p>
          <p><strong>Mão de obra:</strong> R$ ${maoObra.toFixed(2)}</p>
          <p class="mt-4 text-green-600 font-bold">Custo Total Estimado: R$ ${custoTotal}</p>
          <p class="text-blue-600 font-semibold">Custo por Placa: R$ ${custoPorPlaca}</p>
        </div>
        <button onclick="window.print()" class="mt-4 bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">Imprimir Orçamento</button>
      `;
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md p-6">
    <div class="flex justify-center mb-4">
      <img src="Purisol.png" alt="Logo PURISOL" class="h-24" />
    </div>
    <h1 class="text-2xl font-bold mb-4 text-center text-blue-700">Orçamento Sistema de Limpeza PURISOL</h1>
    <div class="mb-4">
      <label class="block font-semibold">Nome do Cliente:</label>
      <input type="text" id="nome" class="w-full border p-2 rounded" />
    </div>
    <div class="mb-4">
      <label class="block font-semibold">Contato (Telefone ou E-mail):</label>
      <input type="text" id="contato" class="w-full border p-2 rounded" />
    </div>
    <div class="mb-4">
      <label class="block font-semibold">Quantidade de Placas:</label>
      <input type="number" id="placas" class="w-full border p-2 rounded" />
    </div>
    <button onclick="calcularOrcamento()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-bold w-full">Calcular Orçamento</button>
    <div id="resultado" class="mt-6 text-sm"></div>
  </div>
</body>
</html>
